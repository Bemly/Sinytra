plugins {
    id("java-library")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// android.jar is not on the compile classpath of a plain java-library module.
// Use `options.bootstrapClasspath` (the supported Gradle API) so javac sees
// BOTH android.jar (real public framework types: Context, View, WebView, ...)
// AND this module's own source output (sibling stub types in android.webkit).
// Plain `-classpath` compilerArgs replace the whole classpath and hide our
// own stubs from each other — that is why sibling types went missing.
// The platform is auto-detected (highest android-X under ANDROID_HOME):
// hardcoding one level breaks on SDKs that only ship what Gecko needs
// (2026-10-07 Intel clean-room: only android-37.2 present). Public API is
// cumulative, so compiling stubs against a newer android.jar is safe.
def androidJar = findHighestAndroidJar()

def findHighestAndroidJar() {
    def platformsDir = new File(System.getenv("ANDROID_HOME"), "platforms")
    def jars = ((platformsDir.listFiles() ?: []) as List).findAll { f ->
        f.isDirectory() && new File(f, "android.jar").isFile()
    }
    if (jars.isEmpty()) {
        throw new GradleException(
            "No android.jar under ${platformsDir} — install a platform via sdkmanager")
    }
    def best = jars.max { a, b -> apiLevelOf(a.name) <=> apiLevelOf(b.name) }
    def jar = new File(best, "android.jar").absolutePath
    logger.lifecycle("framework-stubs: compiling against ${jar}")
    return jar
}

def apiLevelOf(String dirName) {
    def m = (dirName =~ /android-(\d+)(?:\.(\d+))?/)
    return m.matches() ? (m.group(1) as int) * 1000 + ((m.group(2) ?: "0") as int) : -1
}

tasks.withType(JavaCompile).configureEach { task ->
    // Prepend android.jar to the javac classpath WITHOUT replacing the rest
    // (which carries compileOnly deps + sibling stub source output).
    doFirst {
        def fullCp = androidJar + java.io.File.pathSeparator + task.classpath.asPath
        task.options.compilerArgs = ["-classpath", fullCp] + task.options.compilerArgs
        task.classpath = files()
    }
}

dependencies {
    compileOnly("androidx.annotation:annotation:1.9.1")
}
