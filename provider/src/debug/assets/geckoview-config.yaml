# Sinytra debug GeckoView config (overrides src/main for debug builds).
# Same hygiene prefs as the base file, plus the 0005 instrumentation gate.
# Release builds package only the base file — sinytra.log.enabled stays
# default-false there and no Sinytra instrumentation reaches logcat.
env:
  # Forensics gate (STAYS OFF for verdict rounds; enable only for death
  # capture rounds, COOLAPK.md §5-0b):
  # Full flood (v6 used): DocumentChannel:5,nsDocShell:5,BrowsingContext:5,Process:5,nsHttp:5,timestamp
  # Reduced (v22 proved safe for 90s): DocumentChannel + BrowsingContext.
  MOZ_LOG: DocumentChannel:5,BrowsingContext:5,timestamp
prefs:
  network.connectivity-service.enabled: false
  network.captive-portal-service.enabled: false
  services.settings.server: http://127.0.0.1:1
  sinytra.log.enabled: true
  # v23 experiment reopened (v21-blank attribution): fission-migration
  # invalidation-loss hypothesis. Diagnostic only — fission off drops
  # site isolation, never ship without a decision.
  fission.autostart: false
  # JS-dispatch layer logging (same forensics round as MOZ_LOG above):
  # GeckoViewNavigation/Settings/StorageController debug chain. The
  # dispatch-death prime suspect lives here, not in MOZ_LOG.
  geckoview.logging: Debug
  # M3 experiment (2026-10-02, 0017 triage): GPU process OFF to isolate
  # whether the provider-scoped GPU process boundary is a necessary
  # condition for the sync-compositor UI hang (1855536 class). With no GPU
  # process, UiCompositorControllerChild.OnCompositorSurfaceChanged
  # early-returns and the unwatched Binder hop disappears. mirror:once —
  # read at GeckoRuntime.create, before any GPU decision (GeckoRuntimeHolder).
  # Debug-only: shipping this needs the perf/memory tradeoff decision.
  # SUSPENDED 2026-10-02 for M5-A validation (0017 needs GPU ON to exercise
  # the Binder hop): re-enable by uncommenting. M3/M3b stay documented
  # fallbacks (STATUS §1w).
  # layers.gpu-process.enabled: false
  # M3b (2026-10-02): allow WebGL in the parent process on top of M3.
  # Tests whether "GPU-process isolation" decouples from "WebGL capable":
  # M3 disables WebGL via FEATURE_WEBGL_NO_GPU_PROCESS (gfxPlatform.cpp);
  # this pref re-enables parent-process GL. Tradeoff under test: driver
  # crashes land in the host instead of an isolated GPU child.
  # webgl.allow-in-parent: true
