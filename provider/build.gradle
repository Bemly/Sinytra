plugins {
    id("com.android.application")
}

// BOOTSTRAP §3②: local GeckoView substitution is OPT-IN until a local
// objdir exists (`./mach build` under the sibling checkout). Daily builds
// keep the pinned Maven AAR below; enable with -PsinytraLocalGecko.
// Sibling checkout: /Volumes//Projects/firefox (BOOTSTRAP §4 recommends
// ~/src — this machine's internal disk has ~7GB free, so the sibling
// lives on the external volume; recorded in firefox-patches/README.md).
def sinytraLocalGecko = (project.findProperty('sinytraLocalGecko') ?: 'false').toBoolean()
if (sinytraLocalGecko) {
    ext.topsrcdir = file("${rootProject.projectDir}/../firefox").absolutePath
    ext.topobjdir = file("${ext.topsrcdir}/objdir-opt").absolutePath
    apply from: "${ext.topsrcdir}/substitute-local-geckoview.gradle"
    // PREFER_PROJECT ignores the settings repositories once a project
    // repo exists — the substituted AAR's transitive deps (kotlin-stdlib,
    // androidx.*) would have nowhere to resolve. Mirror the settings
    // repos at project level on this opt-in path.
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace = "org.mozilla.geckowebview"
    // GeckoView 153 stable: AAR minCompileSdk=1, androidx.core 1.18.0 — builds clean
    // with AGP 9.x + compileSdk 36. (GV 154+ demands compileSdk 37.1, not yet
    // exposed by the installed SDK snapshot.) targetSdk stays 34 (API-34 device).
    compileSdk = 36

    defaultConfig {
        applicationId = "org.mozilla.geckowebview"
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = "0.1.0-p1"
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
        }
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // JVM unit tests (ROADMAP §5 tests/unit): android.* calls that the code
    // touches incidentally (Log, WebMessage ctor) must no-op instead of
    // throwing "not mocked" — the logic under test is bridge translation,
    // not framework behavior (that is the device harness's job).
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    sourceSets {
        test {
            // AGENTS.md §1 layout: unit tests live in the top-level tests/
            // tree, compiled into the standard Gradle unit-test source set.
            java {
                srcDirs += rootProject.file('tests/unit/java')
            }
        }
    }
}

dependencies {
    // Pinned stable. GV 153: minCompileSdk=1, builds with compileSdk 36.
    // (GV 154+ needs compileSdk 37.1 — revisit when the SDK snapshot ships it.)
    // Under -PsinytraLocalGecko the coordinate swaps to geckoview-nightly:
    // Mozilla's substitute-local-geckoview.gradle only maps nightly/beta
    // module names (the artifact itself is replaced by the local build,
    // so the version string is irrelevant on that path).
    def gvModule = sinytraLocalGecko ? 'geckoview-nightly' : 'geckoview'
    implementation("org.mozilla.geckoview:${gvModule}:153.0.20260810162159")
    implementation("androidx.annotation:annotation:1.9.1")
    // androidx.webkit boundary interfaces ship inside webkit AAR classes.jar;
    // compileOnly: real androidx classes come from the app at runtime.
    // debugImplementation: harness (P0GlueActivity) drives the glue entry
    // point in-process, so the debug APK must carry the boundary types;
    // release keeps them out (app provides androidx.webkit).
    compileOnly("androidx.webkit:webkit:1.12.1")
    debugImplementation("androidx.webkit:webkit:1.12.1")
    // Hidden AOSP android14 webkit APIs (WebViewFactoryProvider/WebViewProvider/
    // WebViewDelegate/...). compileOnly: real classes come from the host
    // process framework at runtime; stubs are javac-only. See framework-stubs/.
    compileOnly(project(":framework-stubs"))
    // JVM unit tests: JUnit4 + REAL org.json (the mockable android.jar stubs
    // JSONObject to no-ops, which would make optString/optJSON routing
    // untestable — MessageBridge/JavascriptBridge depend on real JSON).
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
}
