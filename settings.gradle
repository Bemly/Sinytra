pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
// -PsinytraLocalGecko (BOOTSTRAP §3②): Mozilla's substitute-local-geckoview
// script adds a project-level maven repo, which FAIL_ON_PROJECT_REPOS
// forbids — relax to PREFER_PROJECT only on that opt-in path.
def sinytraLocalGecko = (hasProperty('sinytraLocalGecko') ? sinytraLocalGecko : 'false').toBoolean()
dependencyResolutionManagement {
    repositoriesMode.set(sinytraLocalGecko
            ? RepositoriesMode.PREFER_PROJECT
            : RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://maven.mozilla.org/maven2/") }
    }
}
rootProject.name = "Sinytra"
include(":provider")
include(":framework-stubs")
